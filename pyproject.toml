[project]
name = "csat-nlp"
version = "0.1.0"
description = "Korean CSAT Question Answering with LLM + RAG"
requires-python = ">=3.11,<3.12"

# 의존성
dependencies = [
    # Deep Learning (H/W dependent)
    "auto_gptq==0.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "bitsandbytes==0.44.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.6.0",
    # Deep Learning (Frameworks & Optimization)
    "datasets",
    "evaluate==0.4.3",
    "huggingface-hub==0.30,<1",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "tqdm==4.67.0",
    "transformers>=4.51,<5",
    "trl", "peft", "optimum", # 파인튜닝용 의존성 고정 해제
    "wandb==0.18.5",
    "pandas==2.2.3",
    # RAG
    "elasticsearch==8.16.0",
    "konlpy==0.6.0",
    "rank-bm25==0.2.2",
    "wikiextractor==3.0.6",
    "faiss-cpu==1.9.0",
    # Utils & Serving
    "beautifulsoup4==4.12.3",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.5",
    "loguru==0.7.2",
    "matplotlib==3.9.2",
    "python-dotenv==1.0.1",
    "reportlab==4.2.5",
    "streamlit==1.40.1",
    "pdfminer.six==20240706",
    "sentencepiece>=0.2.1",
    "mlflow>=3.16.1",
    "anthropic>=1.15.0",
    "bm25s>=0.3.14",
    "kiwipiepy>=0.24.1",
    "vllm==0.8.5.post1; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "ruff==0.7.2",
  "pytest==8.3.2",
  "pre-commit==4.0.1",
]


[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# pytorch
[tool.uv.sources]
torch = [
  {index = "pytorch-cu124", marker = "sys_platform == 'linux'"},
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# pytest
[tool.pytest.ini_options]
addopts = "-ra -v -l"

[tool.ruff]
line-length = 120
target-version = "py310"

# Exclude the following files and directories.
exclude = [
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "_build",
  "buck-out",
  "build",
  "dist",
  "env",
  "venv",
  "**/*.ipynb",
]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
section-order = ["standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
